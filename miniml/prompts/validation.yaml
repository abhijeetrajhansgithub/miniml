base_validation_prompt_for_get_refs: |
  You are a data science expert. Given the following data for a particular use case, validate the output and strictly return the JSON output asked.

  Here is the memory that is needed:
  [AGENT_MEMORY]
  
  ----
  Data for the use case:
  [DATA]

  --- 
  Context for the data:
  [CONTEXT]
  
  ----
  LATEST Generated output:
  - Use this generated output to assess the final output strictly
  [OUTPUT]

  ----
  OUTPUT FORMAT
  - do not give any code implementation
  - strictly give the output that is asked
  - output json should strictly be inside <output> ... </output> tags
  - do not give extra reasoning

  FINAL OUTPUT THAT IS NEEDED FROM YOU: 
  <output>
  {
    "valid": "boolean [true/false]",
    "reasoning": "string"
  }
  </output>


retry_validation_prompt_for_get_refs: |
  You are a data science expert. Given the following data for a particular use case, validate the output.
  
  The previous validation failed. Please review the feedback and provide a corrected output.
  
  Previous validation feedback:
  <feedback>
  [FEEDBACK]
  </feedback>

base_validation_prompt_for_target_finder: |
  You are a data science expert. Given the following data for a particular use case, validate the output and strictly return the JSON output asked.
  See if the column output is correct or not. You are supposed to find the target column.

  Here is the memory that is needed:
  - Memory refers to the previous attempts made in validation, from least recent to most recent order.
  [AGENT_MEMORY]

  --- 
  Context for the data:
  [CONTEXT]

  ----
  LATEST Generated output:
  - Use the below generated output to assess the final output strictly
  [OUTPUT]

  ----
  OUTPUT FORMAT
  - do not give any code implementation
  - strictly give the output that is asked
  - output json should strictly be inside <output> ... </output> tags
  - do not give extra reasoning

  FINAL OUTPUT THAT IS NEEDED FROM YOU: 
  <output>
  {
    "valid": "boolean [true/false]",
    "reasoning": "string"
  }
  </output>

retry_validation_prompt_for_target_finder: |
  You are a data science expert. Given the following data for a particular use case, validate the output.
  See if the column output is correct or not. You are supposed to find the target column.
  
  The previous validation failed. Please review the feedback and provide a corrected output.
  
  Previous validation feedback:
  <feedback>
  [FEEDBACK]
  </feedback>


base_validation_prompt_for_apply_refs_for_tool_exec: |
  You are a data science expert. Your job is to verify whether the correct tools were selected
  for the given imputation and outlier strategies.

  Evaluate ONLY whether the tool names match the strategies in the context.
  Ignore all other fields. Do not consider memory, arguments, or df parameters in your assessment.

  ---
  Context:
  [CONTEXT]

  ---
  Tools that were selected:
  [OUTPUT]

  ---
  Validation rules:
  - The imputation_strategy in the context must have a matching tool selected
    (e.g. "knn-imputer" requires fn_tool_knn_imputer).
  - The outlier_strategy in the context must have a matching tool selected
    (e.g. "z-score" requires fn_tool_zscore_outlier).
  - If BOTH required tools are present in the selection, valid = true.
  - If either required tool is missing or wrong, valid = false.
  - Do not fail validation for wrong arguments, extra arguments, or missing df/cols.
    Tool name correctness is the only criterion.
  - If the tool name contains the strategy name in it, it is the correct tool, example: strategy: 'mode' becomes 'fn_tool_mode_imputer' and strategy: 'mean' becomes 'fn_tool_mean_imputer'

  [AGENT_MEMORY]

  ---
  OUTPUT FORMAT
  - Output JSON strictly inside <output> ... </output> tags.
  - No code, no extra text outside the tags.

  <output>
  {
    "valid": true,
    "reasoning": "string"
  }
  </output>


retry_validation_prompt_for_apply_refs_for_tool_exec: |
  A previous tool selection validation failed. The failure reason is shown below.
  Re-evaluate whether the newly selected tools match the required strategies.
  Only assess tool name correctness against the strategies — ignore all other fields.

  Previous failure reason:
  <feedback>
  [FEEDBACK]
  </feedback>


base_validation_prompt_for_apply_refs_for_proc_end: |
  You are a data science expert. Check whether all required tools were executed
  for the given strategies.

  Both an imputation tool AND an outlier detection tool must have been used.
  The tool names must match the strategies specified in the context.

  ---
  Context:
  [CONTEXT]

  ---
  Confirmed tool executions:
  [EXECUTION_HISTORY]

  ---
  Validation rules:
  - Check that a tool matching imputation_strategy was executed.
  - Check that a tool matching outlier_strategy was executed.
  - If both were executed, valid = true.
  - If either is missing, valid = false and name specifically which strategy is missing.

  [AGENT_MEMORY]

  ---
  OUTPUT FORMAT
  - Output JSON strictly inside <output> ... </output> tags.
  - No code, no extra text outside the tags.
  - If valid is false, reasoning must name the missing strategy.
  - If valid is true, reasoning should be null.

  <output>
  {
    "valid": true,
    "reasoning": null
  }
  </output>


retry_validation_prompt_for_apply_refs_for_proc_end: |
  A previous proc-end validation failed. Review the failure reason and re-check
  whether all required tools were executed.

  Previous failure reason:
  <feedback>
  [FEEDBACK]
  </feedback>
